[package]
name = "rust-runner"
version = "0.2.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1.18.2"
axum = "0.8.9"
governor = "0.10.4"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
libc = "0.2.191"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
tokio = { version = "1.53.3", features = ["full", "test-util"] }
tower = "0.5.3"
