name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a full commit SHA (GitHub's security hardening
# guidance). The comment names the release; Dependabot keeps them current.
jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  lessons:
    name: Lessons compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The sandbox's Rust version, not floating `stable`: lessons are graded
      # here as the runner will grade them. Bump with runner/sandbox.Dockerfile.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runner
      - name: Build rr-grade
        run: cargo build --release --locked -p rr-grade
        working-directory: runner
      - run: python3 tool/check_lessons.py --self-test
      - run: python3 tool/check_lessons.py --strict
      - name: Translation checker tests
        run: python3 tool/test_check_lessons.py
      - run: python3 tool/check_errors.py

  runner:
    name: Runner fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runner
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the rr-grade crate, whose tests compile with the host's rustc.
      - run: cargo test --workspace

  runner-sandbox:
    name: Runner Docker sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runner
      - name: Build the sandbox image
        run: docker build -t rust-runner-sandbox -f sandbox.Dockerfile .
      # GitHub's runners have Docker with the default runc runtime. gVisor
      # (runsc) is not installed, so this checks the container limits and
      # the blocked network, not gVisor itself. RUNNER_DOCKER_RUNTIME stays
      # unset.
      - name: Run the ignored Docker test
        run: cargo test -- --ignored

  firebase:
    name: Firestore rules and Cloud Function
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore rules
        run: sh test/firestore_rules/run.sh
      - name: Cloud Function
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          npm test
