# Keeps the pinned action SHAs and the functions/ npm packages current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /test/firestore_rules
    schedule:
      interval: weekly
